package:
  name: std-lib
  authors: ["Jure Vreča <jure.vreca@ijs.si>"]
  description: "Standard components used in RTL projects."


sources:
  - rtl/register.sv
  - rtl/register_wclear.sv
  - rtl/shift_register.sv
  - rtl/cntr.sv
  - rtl/skidbuffer.sv
